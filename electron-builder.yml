afterPack: "./build/afterPack.js"
appId: com.macmath.app
productName: MacMath
directories:
  output: dist
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  identity: null
  extendInfo:
    LSUIElement: true
  target:
    - dmg
    - zip
dmg:
  title: MacMath
  iconSize: 80
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
# Only what the app runs; production dependencies (mathlive) are added automatically.
# A catch-all pattern would also pack local, untracked folders into the app.
files:
  - main.js
  - package.json
  - "src/**/*"
  - "!src/image.png"
extraMetadata:
  main: main.js
